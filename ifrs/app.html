<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IFRS Workbench — WTB</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F5F6F8; --bg2: #EAECF0; --bg3: #DCE0E8;
  --surface: #FFFFFF; --border: rgba(20,30,55,0.08); --border-strong: rgba(20,30,55,0.15);
  --text: #161B2E; --text2: #545B72; --text3: #9499AC;
  --accent: #2E3A8C; --accent-text: #FFFFFF;
  --green: #14805E; --green-bg: #DFF1E9;
  --amber: #92620C; --amber-bg: #F8EAD3;
  --blue: #2E3A8C; --blue-bg: #E5E7F8;
  --purple: #5E4B9E; --purple-bg: #ECE6F8;
  --coral: #A14438; --coral-bg: #F7E5E2;
}
[data-theme="dark"] {
  --bg: #10131F; --bg2: #161A2B; --bg3: #1F2438;
  --surface: #141828; --border: rgba(225,228,240,0.08); --border-strong: rgba(225,228,240,0.15);
  --text: #E7E9F5; --text2: #9DA2BC; --text3: #5F6480;
  --accent: #8C97FF; --accent-text: #10131F;
  --green: #59CDA3; --green-bg: #11302A;
  --amber: #E3B25C; --amber-bg: #362708;
  --blue: #8C97FF; --blue-bg: #1C2150;
  --purple: #B5A0EC; --purple-bg: #2A2050;
  --coral: #E0897A; --coral-bg: #3A1F1A;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
input,select,textarea,button{font-family:'Inter',sans-serif}

.shell{display:grid;grid-template-rows:48px 1fr;grid-template-columns:200px 1fr;height:100vh;overflow:hidden}
.topbar{grid-column:1/-1;background:var(--surface);border-bottom:0.5px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;z-index:10}
.logo{width:24px;height:24px;background:var(--accent);border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo svg{width:13px;height:13px}
.app-title{font-size:13px;font-weight:500;color:var(--text);margin-right:8px}
.company-badge{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.theme-btn{width:32px;height:18px;background:var(--bg3);border-radius:9px;border:0.5px solid var(--border-s);cursor:pointer;position:relative;flex-shrink:0}
.theme-btn::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;background:var(--text);border-radius:50%;transition:transform .2s}
[data-theme="dark"] .theme-btn::after{transform:translateX(14px)}
.status-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.status-dot.ok{background:var(--green)}
.status-dot.bad{background:var(--red)}
.status-text{font-size:11px;color:var(--text3)}

.sidebar{background:var(--surface);border-right:0.5px solid var(--border);overflow-y:auto;padding:12px 8px}
.sidebar-section{margin-bottom:4px}
.sidebar-label{font-size:10px;font-family:'DM Mono',monospace;color:var(--text3);padding:6px 8px 4px;text-transform:uppercase;letter-spacing:.06em}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--text2);font-size:12px;transition:background .1s,color .1s}
.nav-item:hover{background:var(--bg2);color:var(--text)}
.nav-item.active{background:var(--bg3);color:var(--text);font-weight:500}
.nav-badge{margin-left:auto;font-size:9px;padding:1px 5px;border-radius:10px;font-weight:500}
.nb-ok{background:var(--green-bg);color:var(--green)}
.nb-warn{background:var(--amber-bg);color:var(--amber)}
.nb-bad{background:var(--red-bg);color:var(--red)}
.nb-lock{background:var(--bg3);color:var(--text3)}

.main{overflow-y:auto;background:var(--bg)}
.screen{display:none;padding:20px 24px;max-width:1180px;margin:0 auto;width:100%}
.screen.active{display:block}
.screen-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.screen-title{font-size:15px;font-weight:500;color:var(--text)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:5px 12px;font-size:12px;border:0.5px solid var(--border-s);border-radius:6px;background:var(--surface);color:var(--text);cursor:pointer;transition:background .12s}
.btn:hover{background:var(--bg2)}
.btn-p{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.btn-p:hover{opacity:.85}
.btn-sm{padding:3px 8px;font-size:11px}

.card{background:var(--surface);border:0.5px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:12px}
.card-header{padding:10px 14px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.card-title{font-size:12px;font-weight:500;color:var(--text)}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:500;white-space:nowrap}
.b-ok{background:var(--green-bg);color:var(--green)}
.b-warn{background:var(--amber-bg);color:var(--amber)}
.b-bad{background:var(--red-bg);color:var(--red)}
.b-lock{background:var(--bg3);color:var(--text3)}
.b-blue{background:var(--blue-bg);color:var(--blue)}

.tbl{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed}
.tbl th{background:var(--bg2);padding:6px 9px;text-align:right;font-weight:500;font-size:10px;color:var(--text2);border-bottom:0.5px solid var(--border);white-space:nowrap;font-family:'DM Mono',monospace;position:sticky;top:0}
.tbl th.tl,.tbl td.tl{text-align:left}
.tbl th.grp{text-align:center;background:var(--bg3);font-size:9px;color:var(--text3)}
.tbl td{padding:5px 9px;text-align:right;border-bottom:0.5px solid var(--border);color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td.tl{color:var(--text2);white-space:normal}
.tbl td.mono{font-family:'DM Mono',monospace;font-size:10px}
.tbl tr.sec td{background:var(--bg2);font-weight:500;font-size:10px;color:var(--text2);text-align:left}
.tbl tr.tot td{background:var(--bg2);font-weight:500;border-top:0.5px solid var(--border-s)}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.unmapped td{background:var(--amber-bg)}
.pos{color:var(--green)}.neg{color:var(--red)}.adj{color:var(--blue)}.zero{color:var(--text3)}
.lock-icon{font-size:9px;color:var(--text3);margin-left:3px}
.tbl-wrap{overflow-x:auto;max-height:560px;overflow-y:auto}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.metric{background:var(--bg2);border-radius:8px;padding:12px 14px}
.metric-label{font-size:10px;color:var(--text3);margin-bottom:3px}
.metric-val{font-size:20px;font-weight:500;font-family:'DM Mono',monospace;color:var(--text)}
.metric-sub{font-size:10px;color:var(--text3);margin-top:2px}

.paste-zone{border:0.5px dashed var(--border-s);border-radius:8px;padding:18px;background:var(--bg2);margin-bottom:10px}
.paste-zone textarea{width:100%;min-height:90px;font-family:'DM Mono',monospace;font-size:11px;border:0.5px solid var(--border-s);border-radius:6px;padding:8px;background:var(--surface);color:var(--text);resize:vertical}
.paste-row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.paste-hint{font-size:10px;color:var(--text3);margin-bottom:6px;font-family:'DM Mono',monospace}

.je-form{display:grid;grid-template-columns:60px 90px 1fr 90px 90px 1fr 60px 28px;gap:6px;align-items:center;padding:7px 10px;border-bottom:0.5px solid var(--border-s)}
.je-form.hdr{background:var(--bg2);font-size:9px;font-weight:500;color:var(--text2);font-family:'DM Mono',monospace;border-bottom:0.5px solid var(--border-s)}
.je-form input,.je-form select{font-size:11px;padding:3px 6px;border:0.5px solid var(--border-s);border-radius:5px;background:var(--surface);color:var(--text);width:100%}
.je-form input:disabled{background:var(--bg3);color:var(--text3);cursor:not-allowed}
.je-group-sep{border-top:2px solid var(--text3);margin-top:3px;padding-top:10px}
.je-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;padding:0}
.je-del:hover{color:var(--red)}

.toast{position:fixed;bottom:20px;right:20px;background:var(--accent);color:var(--accent-t);padding:10px 16px;border-radius:8px;font-size:12px;font-weight:500;z-index:999;opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none;max-width:320px}
.toast.show{opacity:1;transform:translateY(0)}

.stab-bar{display:flex;border-bottom:0.5px solid var(--border)}
.stab{padding:8px 14px;font-size:11px;color:var(--text3);cursor:pointer;border-bottom:1.5px solid transparent}
.stab.active{color:var(--text);border-bottom-color:var(--text);font-weight:500}
.stab-panel{display:none}.stab-panel.active{display:block}

.tbl-note{padding:8px 12px;font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;border-top:0.5px solid var(--border);display:flex;gap:16px;flex-wrap:wrap}
.empty-state{padding:32px 20px;text-align:center;color:var(--text3);font-size:12px}
.field-row{display:grid;grid-template-columns:1fr 110px;gap:6px;align-items:center;font-size:12px;padding:3px 0}
.field-row span{color:var(--text2)}
.field-row input{font-size:12px;padding:4px 7px;border:0.5px solid var(--border-s);border-radius:5px;background:var(--surface);color:var(--text);text-align:right}

.lang-toggle{display:flex;border:0.5px solid var(--border-s);border-radius:6px;overflow:hidden;flex-shrink:0}
.lang-btn{padding:4px 9px;font-size:11px;color:var(--text2);background:var(--surface);border:none;cursor:pointer;font-family:'DM Mono',monospace}
.lang-btn.active{background:var(--accent);color:var(--accent-t)}

.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px}
.auth-card{width:100%;max-width:380px;background:var(--surface);border:0.5px solid var(--border);border-radius:14px;padding:32px 28px}
.auth-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.auth-logo{width:36px;height:36px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center}
.auth-logo svg{width:19px;height:19px}
.auth-title{font-size:18px;font-weight:500;color:var(--text);margin-bottom:4px}
.auth-sub{font-size:12px;color:var(--text2);margin-bottom:24px}
.auth-field{margin-bottom:14px}
.auth-field label{display:block;font-size:11px;color:var(--text2);margin-bottom:5px}
.auth-field input{width:100%;font-size:13px;padding:8px 10px;border:0.5px solid var(--border-s);border-radius:7px;background:var(--bg);color:var(--text)}
.auth-field input:focus{outline:none;border-color:var(--text2)}
.auth-btn{width:100%;padding:9px;font-size:13px;font-weight:500;background:var(--accent);color:var(--accent-t);border:none;border-radius:7px;cursor:pointer;margin-top:6px}
.auth-btn:hover{opacity:.88}
.auth-switch{text-align:center;font-size:12px;color:var(--text2);margin-top:18px}
.auth-switch a{color:var(--text);font-weight:500;cursor:pointer;text-decoration:underline}
.auth-error{font-size:11px;color:var(--red);background:var(--red-bg);padding:7px 10px;border-radius:6px;margin-bottom:14px;display:none}
.auth-error.show{display:block}

.autocomplete-wrap{position:relative}
.autocomplete-list{position:absolute;top:100%;left:0;min-width:260px;background:var(--surface);border:0.5px solid var(--border-s);border-radius:6px;max-height:200px;overflow-y:auto;z-index:50;box-shadow:0 4px 14px rgba(0,0,0,0.12);margin-top:2px}
.autocomplete-item{padding:6px 9px;font-size:11px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.autocomplete-item:hover,.autocomplete-item.hi{background:var(--bg2)}
.autocomplete-item .ac-code{font-family:'DM Mono',monospace;color:var(--text3);flex-shrink:0}
.autocomplete-item .ac-name{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.user-menu{position:relative}
.user-chip{display:flex;align-items:center;gap:6px;padding:3px 8px 3px 3px;border-radius:20px;background:var(--bg2);cursor:pointer;border:0.5px solid var(--border)}
.user-avatar{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-t);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;flex-shrink:0}
.user-name{font-size:11px;color:var(--text)}
.user-dropdown{position:absolute;top:32px;right:0;background:var(--surface);border:0.5px solid var(--border-s);border-radius:8px;min-width:170px;box-shadow:0 4px 14px rgba(0,0,0,0.12);overflow:hidden;z-index:60}
.user-dropdown-item{padding:9px 12px;font-size:12px;color:var(--text);cursor:pointer}
.user-dropdown-item:hover{background:var(--bg2)}
.user-dropdown-item.danger{color:var(--red)}
.user-dropdown-sep{border-top:0.5px solid var(--border)}
</style>

</head>

/*
WTB Calculation Engine
Mirrors the real PwC-style Excel WTB workbook logic:
  - WTB sheet: one row per statutory account code (D column = key)
  - Carry / AJE / RJE: journal-entry-style sheets, each row has
    {adjNo, accountCode, description, debit, credit}
    description is auto-derived from the account map (VLOOKUP),
    debit/credit are user input UNLESS the row is sourced from an
    automated module (FA schedule, ETB/actuarial), in which case the
    amount is locked and flows in from that module.
  - WTB.IFRS balance = Statutory + CarryDr - CarryCr + AjeDr - AjeCr + RjeDr - RjeCr
  - Def. Tax: compares (Statutory + RJE) vs IFRS balance per account, * tax rate
  - Output statements (BBS/IIS): group WTB rows by account-code ranges into
    presentation line items
*/

// ---------- Account map ----------
// Company-agnostic: loaded per company. Each entry keyed by accountCode.
class AccountMap {
  constructor(rows = []) {
    this.byCode = new Map();
    rows.forEach(r => this.add(r));
  }
  add(row) {
    this.byCode.set(String(row.accountCode), row);
  }
  describe(code) {
    const r = this.byCode.get(String(code));
    return r ? r.accountName : null;
  }
  get(code) {
    return this.byCode.get(String(code)) || null;
  }
  all() {
    return Array.from(this.byCode.values());
  }
}

// ---------- Journal sheets (Carry / AJE / RJE) ----------
// balanceRule: 'bs_re'   -> Carry: balance sheet vs retained earnings
//              'bs_is'   -> AJE: balance sheet vs income statement
//              'bs_bs'   -> RJE: balance sheet vs balance sheet
//              'is_is'   -> RJE: income statement vs income statement
class JournalSheet {
  constructor(name, balanceRules) {
    this.name = name;
    this.balanceRules = balanceRules; // array of allowed rule keys
    this.entries = []; // {adjNo, groupLabel, accountCode, description, debit, credit, source, locked}
  }

  addEntry({ adjNo, groupLabel, accountCode, debit = 0, credit = 0, source = 'manual', locked = false, comment = '' }) {
    this.entries.push({ adjNo, groupLabel, accountCode: String(accountCode), debit, credit, source, locked, comment });
  }

  // mirrors =SUMIF(B:B, code, D:D) and =SUMIF(B:B, code, E:E)
  sumForCode(code) {
    const target = String(code);
    let debit = 0, credit = 0;
    for (const e of this.entries) {
      if (e.accountCode === target) {
        debit += e.debit || 0;
        credit += e.credit || 0;
      }
    }
    return { debit, credit };
  }

  // mirrors the Check sheet: =SUM(D:D)-SUM(E:E), should be 0 when balanced
  checkBalance() {
    const debit = this.entries.reduce((s, e) => s + (e.debit || 0), 0);
    const credit = this.entries.reduce((s, e) => s + (e.credit || 0), 0);
    return { debit, credit, diff: round2(debit - credit) };
  }

  groupedByAdjNo() {
    const groups = new Map();
    for (const e of this.entries) {
      const key = e.adjNo ?? '—';
      if (!groups.has(key)) groups.set(key, { adjNo: key, label: e.groupLabel || '', rows: [] });
      groups.get(key).rows.push(e);
    }
    return Array.from(groups.values());
  }
}

// ---------- Trial balance (statutory, raw ledger) ----------
class TrialBalance {
  constructor(rows = []) {
    // rows: {accountCode, debit, credit}
    this.byCode = new Map();
    rows.forEach(r => {
      const code = String(r.accountCode);
      const existing = this.byCode.get(code) || { debit: 0, credit: 0 };
      existing.debit += r.debit || 0;
      existing.credit += r.credit || 0;
      this.byCode.set(code, existing);
    });
  }
  // mirrors VLOOKUP into Detailed TB balance column (net, signed)
  balanceForCode(code) {
    const r = this.byCode.get(String(code));
    if (!r) return 0;
    return round2(r.debit - r.credit);
  }
  checkBalance() {
    let debit = 0, credit = 0;
    for (const v of this.byCode.values()) { debit += v.debit; credit += v.credit; }
    return { debit, credit, diff: round2(debit - credit) };
  }
}

// ---------- WTB structure rows ----------
// Each structure row mirrors columns A-E of the real WTB sheet:
// section (A), groupCode (B), groupLabel (C), accountCode (D), accountName (E)
class WtbStructure {
  constructor(rows = []) {
    this.rows = rows;
  }
  static fromAccountMap(accountMap) {
    return new WtbStructure(accountMap.all().map(r => ({
      section: r.section,
      groupCode: r.groupCode,
      groupLabel: r.groupLabel,
      accountCode: String(r.accountCode),
      accountName: r.accountName,
      ifrsLine: r.ifrsLine || null,
      noteRef: r.noteRef || null
    })));
  }
}

// ---------- The WTB engine itself ----------
class WtbEngine {
  constructor({ accountMap, trialBalancePY = null, trialBalanceCY, carry, aje, rje }) {
    this.accountMap = accountMap;
    this.structure = WtbStructure.fromAccountMap(accountMap);
    this.tbPY = trialBalancePY ? new TrialBalance(trialBalancePY) : null;
    this.tbCY = new TrialBalance(trialBalanceCY);
    this.carry = carry;   // JournalSheet
    this.aje = aje;       // JournalSheet
    this.rje = rje;       // JournalSheet
  }

  // Builds the full WTB row-by-row, exactly mirroring columns F..M of the real sheet
  computeRows() {
    return this.structure.rows.map(s => {
      const statutory = this.tbCY.balanceForCode(s.accountCode);
      const statutoryPY = this.tbPY ? this.tbPY.balanceForCode(s.accountCode) : null;

      const carrySum = this.carry.sumForCode(s.accountCode);
      const ajeSum = this.aje.sumForCode(s.accountCode);
      const rjeSum = this.rje.sumForCode(s.accountCode);

      // F + G - H + I - J + K - L = M
      const ifrsBalance = round2(
        statutory
        + carrySum.debit - carrySum.credit
        + ajeSum.debit - ajeSum.credit
        + rjeSum.debit - rjeSum.credit
      );

      return {
        section: s.section,
        groupCode: s.groupCode,
        groupLabel: s.groupLabel,
        accountCode: s.accountCode,
        accountName: s.accountName,
        ifrsLine: s.ifrsLine,
        noteRef: s.noteRef,
        statutory,
        statutoryPY,
        carryDr: carrySum.debit,
        carryCr: carrySum.credit,
        ajeDr: ajeSum.debit,
        ajeCr: ajeSum.credit,
        rjeDr: rjeSum.debit,
        rjeCr: rjeSum.credit,
        ifrsBalance
      };
    });
  }

  // mirrors grouping like BBSF/BBS: aggregate computed rows by ifrsLine
  groupByIfrsLine() {
    const rows = this.computeRows();
    const groups = new Map();
    for (const r of rows) {
      const key = r.ifrsLine || '(eşlenmemiş)';
      if (!groups.has(key)) groups.set(key, { ifrsLine: key, total: 0, totalPY: 0, accounts: [] });
      const g = groups.get(key);
      g.total = round2(g.total + r.ifrsBalance);
      g.totalPY = round2(g.totalPY + (r.statutoryPY || 0));
      g.accounts.push(r);
    }
    return Array.from(groups.values());
  }

  // overall WTB balance check: sum of all IFRS balances should net to ~0
  // (assets+liabilities+equity sign convention dependent; exposed for UI)
  checkAll() {
    return {
      tbCY: this.tbCY.checkBalance(),
      tbPY: this.tbPY ? this.tbPY.checkBalance() : null,
      carry: this.carry.checkBalance(),
      aje: this.aje.checkBalance(),
      rje: this.rje.checkBalance()
    };
  }
}

// ---------- Deferred tax module ----------
// mirrors Def. Tax Calculation: compares (Statutory + RJE) vs IFRS balance, * rate
class DeferredTaxEngine {
  constructor(wtbEngine, taxRateByAccount = {}, defaultRate = 0.25) {
    this.wtb = wtbEngine;
    this.taxRateByAccount = taxRateByAccount; // {accountCode: rate}
    this.defaultRate = defaultRate;
  }

  computeRows() {
    const rows = this.wtb.computeRows();
    return rows.map(r => {
      const statPlusRje = round2(r.statutory + r.rjeDr - r.rjeCr);
      const difference = round2(r.ifrsBalance - statPlusRje);
      const rate = this.taxRateByAccount[r.accountCode] ?? this.defaultRate;
      const defTaxAmount = round2(difference * rate * -1);
      const classification = defTaxAmount < 0 ? 'Deferred Tax Liabilities' : 'Deferred Tax Assets';
      return {
        ...r,
        statPlusRje,
        difference,
        rate,
        defTaxAmount,
        classification
      };
    });
  }

  summary() {
    const rows = this.computeRows();
    const dta = round2(rows.filter(r => r.defTaxAmount > 0).reduce((s, r) => s + r.defTaxAmount, 0));
    const dtl = round2(rows.filter(r => r.defTaxAmount < 0).reduce((s, r) => s + r.defTaxAmount, 0));
    return { dta, dtl, net: round2(dta + dtl) };
  }
}

// ---------- FA schedule (feeds AJE automatically, locked) ----------
// IAS 16 day-count depreciation vs statutory (VUK) depreciation
class FaScheduleEngine {
  constructor(assets = []) {
    // assets: {name, accountCodeCost, accountCodeAccDep, cost, activationDate, usefulLifeYears, statutoryAnnualDep, periodEndDate}
    this.assets = assets;
  }

  static daysBetween(d1, d2) {
    const ms = d2.getTime() - d1.getTime();
    return Math.max(0, Math.round(ms / 86400000));
  }

  computeRows(periodEndDate) {
    return this.assets.map(a => {
      const start = new Date(a.activationDate);
      const end = new Date(periodEndDate);
      const fiscalYearStart = new Date(end.getFullYear(), 0, 1);
      const depStart = start > fiscalYearStart ? start : fiscalYearStart;
      const daysInPeriod = FaScheduleEngine.daysBetween(depStart, end) + (depStart <= end ? 1 : 0);
      const daysInYear = (end.getFullYear() % 4 === 0 && (end.getFullYear() % 100 !== 0 || end.getFullYear() % 400 === 0)) ? 366 : 365;
      const annualDep = round2(a.cost / a.usefulLifeYears);
      const ifrsDep = round2(annualDep * daysInPeriod / daysInYear);
      const statutoryDep = round2(a.statutoryAnnualDep ?? annualDep);
      const diff = round2(ifrsDep - statutoryDep);
      return {
        name: a.name,
        accountCodeCost: a.accountCodeCost,
        accountCodeAccDep: a.accountCodeAccDep,
        cost: a.cost,
        activationDate: a.activationDate,
        usefulLifeYears: a.usefulLifeYears,
        daysInPeriod,
        ifrsDep,
        statutoryDep,
        diff
      };
    });
  }

  // produces locked AJE-ready entries: diff > 0 means IFRS dep higher -> Dr expense / Cr acc.dep
  // expenseAccountCode: where the offsetting P&L depreciation expense line sits
  toAjeEntries(periodEndDate, adjNoStart = 1, expenseAccountCode = null) {
    const rows = this.computeRows(periodEndDate);
    const entries = [];
    let adjNo = adjNoStart;
    rows.forEach(r => {
      if (Math.abs(r.diff) < 0.5) return;
      const expAcc = expenseAccountCode || r.expenseAccountCode || r.accountCodeAccDep;
      const label = `IAS 16 — ${r.name} amortisman farkı`;
      if (r.diff > 0) {
        // IFRS depreciation higher: Dr expense, Cr accumulated depreciation
        entries.push({ adjNo, groupLabel: label, accountCode: expAcc, debit: r.diff, credit: 0, source: 'fa_schedule', locked: true });
        entries.push({ adjNo, groupLabel: label, accountCode: r.accountCodeAccDep, debit: 0, credit: r.diff, source: 'fa_schedule', locked: true });
      } else {
        // statutory depreciation higher: reverse direction
        entries.push({ adjNo, groupLabel: label, accountCode: r.accountCodeAccDep, debit: -r.diff, credit: 0, source: 'fa_schedule', locked: true });
        entries.push({ adjNo, groupLabel: label, accountCode: expAcc, debit: 0, credit: -r.diff, source: 'fa_schedule', locked: true });
      }
      adjNo++;
    });
    return entries;
  }
}

function round2(n) {
  return Math.round((n + Number.EPSILON) * 100) / 100;
}

function applyFaScheduleToAje() {
  // remove previously auto-generated fa_schedule entries, recompute, re-add
  state.aje.entries = state.aje.entries.filter(e => e.source !== 'fa_schedule');
  const fa = new FaScheduleEngine(state.faAssets);
  const entries = fa.toAjeEntries(state.periodEnd, 200, 11000);
  entries.forEach(e => state.aje.addEntry(e));
  return fa;
}

function applyEtbToAje() {
  state.aje.entries = state.aje.entries.filter(e => e.source !== 'etb');
  const e = state.etb;
  const adjAmount = e.dbo;
  state.aje.addEntry({ adjNo:299, groupLabel:'IAS 19 — Kıdem tazminatı karşılığı (DBO)', accountCode:e.accountCode, debit:0, credit:adjAmount, source:'etb', locked:true });
  state.aje.addEntry({ adjNo:299, groupLabel:'IAS 19 — Kıdem tazminatı karşılığı (DBO)', accountCode:15100, debit:adjAmount, credit:0, source:'etb', locked:true });
}

function fmt(n) {
  if (n === null || n === undefined || n === 0) return '<span class="zero">—</span>';
  const v = Math.round(n);
  const cls = v < 0 ? 'neg' : '';
  const formatted = Math.abs(v).toLocaleString('tr-TR');
  return '<span class="'+cls+'">' + (v<0 ? '('+formatted+')' : formatted) + '</span>';
}
function fmtPlain(n) {
  if (n === null || n === undefined) return '—';
  return Math.round(n).toLocaleString('tr-TR');
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

function render() {
  const root = document.getElementById('app');
  document.documentElement.dataset.theme = state.theme;
  if (!currentUser) {
    root.innerHTML = renderAuth();
    attachAuthHandlers();
    return;
  }
  root.innerHTML = `
    <div class="shell">
      ${renderTopbar()}
      ${renderSidebar()}
      <div class="main"><div class="screen active">${renderScreen()}</div></div>
    </div>
  `;
  attachHandlers();
}

function renderTopbar() {
  const check = engine.checkAll();
  const TOL = 0.05;
  const allOk = Math.abs(check.carry.diff) < TOL && Math.abs(check.aje.diff) < TOL && Math.abs(check.rje.diff) < TOL;
  const initials = currentUser ? currentUser.name.split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase() : '?';
  return `
  <div class="topbar">
    <div class="logo"><svg viewBox="0 0 13 13" fill="none"><rect x="1" y="1" width="4.5" height="4.5" rx="1" fill="white"/><rect x="7.5" y="1" width="4.5" height="4.5" rx="1" fill="white" opacity=".5"/><rect x="1" y="7.5" width="4.5" height="4.5" rx="1" fill="white" opacity=".5"/><rect x="7.5" y="7.5" width="4.5" height="4.5" rx="1" fill="white"/></svg></div>
    <span class="app-title">${t('appName')}</span>
    <span class="company-badge">${currentUser ? currentUser.company : ''} · WTB</span>
    <div class="topbar-right">
      <span class="status-dot ${allOk ? 'ok' : 'bad'}"></span>
      <span class="status-text">${allOk ? t('allBalanced') : t('hasImbalance')}</span>
      <div class="lang-toggle">
        <button class="lang-btn ${state.lang==='tr'?'active':''}" data-action="set-lang" data-lang="tr">TR</button>
        <button class="lang-btn ${state.lang==='en'?'active':''}" data-action="set-lang" data-lang="en">EN</button>
      </div>
      <button class="theme-btn" id="themeBtn" aria-label="Theme"></button>
      <div class="user-menu">
        <div class="user-chip" id="userChipBtn">
          <div class="user-avatar">${initials}</div>
          <span class="user-name">${currentUser ? currentUser.name : ''}</span>
        </div>
        <div class="user-dropdown" id="userDropdown" style="display:none">
          <div class="user-dropdown-item" data-action="noop">${currentUser ? currentUser.email : ''}</div>
          <div class="user-dropdown-sep"></div>
          <div class="user-dropdown-item danger" data-action="logout">${t('logout')}</div>
        </div>
      </div>
    </div>
  </div>`;
}

  if (id === 'carry') { const c = state.carry.checkBalance(); return Math.abs(c.diff) < 0.05 ? `<span class="nav-badge nb-ok">✓</span>` : `<span class="nav-badge nb-bad">!</span>`; }
  if (id === 'aje') { const c = state.aje.checkBalance(); return Math.abs(c.diff) < 0.05 ? `<span class="nav-badge nb-ok">${state.aje.groupedByAdjNo().length}</span>` : `<span class="nav-badge nb-bad">!</span>`; }
  if (id === 'rje') { const c = state.rje.checkBalance(); return Math.abs(c.diff) < 0.05 ? `<span class="nav-badge nb-ok">${state.rje.groupedByAdjNo().length}</span>` : `<span class="nav-badge nb-bad">!</span>`; }
  if (id === 'wtb') return `<span class="nav-badge nb-lock">🔒</span>`;
  if (id === 'sabit') return `<span class="nav-badge nb-lock">🔒</span>`;
  return '';
}

// ---------- WTB (read-only, fully formula-driven) ----------
function renderWtb() {
  const rows = engine.computeRows();
  const bySection = new Map();
  rows.forEach(r => {
    if (!bySection.has(r.section)) bySection.set(r.section, []);
    bySection.get(r.section).push(r);
  });
  const sectionLabelsTr = {
    'Non-current assets':'Duran varlıklar','Current assets':'Dönen varlıklar',
    'Non-current liability':'Uzun vadeli yükümlülükler','Current liabilities':'Kısa vadeli yükümlülükler',
    'Equity':'Özkaynaklar','Revenue':'Hasılat','Cogs':'Satışların maliyeti',
    'Distribution':'Pazarlama giderleri','Administration':'Genel yönetim giderleri',
    'Interest income':'Faiz geliri','Interest expense':'Faiz gideri','Tax expense':'Vergi gideri'
  };
  const sectionLabelsEn = {
    'Non-current assets':'Non-current assets','Current assets':'Current assets',
    'Non-current liability':'Non-current liabilities','Current liabilities':'Current liabilities',
    'Equity':'Equity','Revenue':'Revenue','Cogs':'Cost of goods sold',
    'Distribution':'Distribution expenses','Administration':'Administrative expenses',
    'Interest income':'Interest income','Interest expense':'Interest expense','Tax expense':'Tax expense'
  };
  const sectionLabels = state.lang === 'en' ? sectionLabelsEn : sectionLabelsTr;
  let bodyHtml = '';
  bySection.forEach((sectionRows, section) => {
    bodyHtml += `<tr class="sec"><td colspan="8">${sectionLabels[section]||section}</td></tr>`;
    sectionRows.forEach(r => {
      const carryNet = round2(r.carryDr - r.carryCr);
      const ajeNet = round2(r.ajeDr - r.ajeCr);
      const rjeNet = round2(r.rjeDr - r.rjeCr);
      bodyHtml += `<tr>
        <td class="tl mono">${r.accountCode}</td>
        <td class="tl">${r.accountName}</td>
        <td>${fmt(r.statutory)}</td><td>${fmt(r.statutoryPY)}</td>
        <td class="adj">${fmt(carryNet)}</td>
        <td class="adj">${fmt(ajeNet)}</td>
        <td class="adj">${fmt(rjeNet)}</td>
        <td>${fmt(r.ifrsBalance)}</td>
      </tr>`;
    });
  });
  const totalStat = rows.reduce((s,r)=>s+r.statutory,0);
  const totalIfrs = rows.reduce((s,r)=>s+r.ifrsBalance,0);
  const totalCarryNet = round2(rows.reduce((s,r)=>s+(r.carryDr-r.carryCr),0));
  const totalAjeNet = round2(rows.reduce((s,r)=>s+(r.ajeDr-r.ajeCr),0));
  const totalRjeNet = round2(rows.reduce((s,r)=>s+(r.rjeDr-r.rjeCr),0));
  return `
  <div class="screen-header">
    <span class="screen-title">${t('wtbTitle')}</span>
    <div class="btn-row"><span class="badge b-lock">${t('readOnly')}</span></div>
  </div>
  <div class="card">
    <div class="card-header"><span class="card-title">${t('wtbAllCols')}</span><span class="badge b-ok">F+G+H+I=J</span></div>
    <div class="tbl-wrap"><table class="tbl" style="min-width:760px">
      <thead>
        <tr><th class="tl" style="width:64px">${t('code')}</th><th class="tl" style="width:180px">${t('accName')}</th>
          <th style="width:90px">${t('cyTab')}</th><th style="width:90px">${t('pyTab')}</th>
          <th style="width:90px">${t('navCarry')} (${t('netLbl')})</th>
          <th style="width:90px">${t('navAje')} (${t('netLbl')})</th>
          <th style="width:90px">${t('navRje')} (${t('netLbl')})</th>
          <th style="width:100px">${t('ifrsBalance')}</th></tr>
      </thead>
      <tbody>${bodyHtml}
        <tr class="tot"><td class="tl" colspan="2">${t('totalStatNet')}</td><td colspan="2">${fmt(totalStat)}</td><td class="adj">${fmt(totalCarryNet)}</td><td class="adj">${fmt(totalAjeNet)}</td><td class="adj">${fmt(totalRjeNet)}</td><td>${fmt(totalIfrs)}</td></tr>
      </tbody>
    </table></div>
    <div class="tbl-note"><span>${t('wtbRowNote')}</span><span>${state.lang==='tr'?'Net = Dr − Cr':'Net = Dr − Cr'}</span><span>${t('amountsTl')}</span></div>
  </div>`;
}

// ---------- Account code autocomplete (search by code or name) ----------
function setupAccountAutocomplete() {
  const inputs = document.querySelectorAll('[data-ac-input]');
  inputs.forEach(input => {
    if (input.disabled) return;
    const wrap = input.closest('.autocomplete-wrap');
    if (!wrap) return;

    const closeList = () => { const l = wrap.querySelector('.autocomplete-list'); if (l) l.remove(); };

    const openList = (query) => {
      closeList();
      const q = query.trim().toLowerCase();
      if (!q) return;
      const matches = state.accountMap.all().filter(a =>
        String(a.accountCode).toLowerCase().includes(q) || a.accountName.toLowerCase().includes(q)
      ).slice(0, 8);
      if (matches.length === 0) return;
      const list = document.createElement('div');
      list.className = 'autocomplete-list';
      matches.forEach(a => {
        const item = document.createElement('div');
        item.className = 'autocomplete-item';
        item.innerHTML = `<span class="ac-code">${a.accountCode}</span><span class="ac-name">${a.accountName}</span>`;
        item.onmousedown = (ev) => {
          ev.preventDefault();
          input.value = a.accountCode;
          closeList();
          input.dispatchEvent(new Event('change'));
        };
        list.appendChild(item);
      });
      wrap.appendChild(list);
    };

    input.oninput = () => openList(input.value);
    input.onfocus = () => openList(input.value);
    input.onblur = () => setTimeout(closeList, 150);
  });
}

function attachAuthHandlers() {
  document.querySelectorAll('[data-action="set-lang"]').forEach(el => {
    el.onclick = () => { state.lang = el.dataset.lang; try { localStorage.setItem('wtb_lang', state.lang); } catch(e){}; render(); };
  });
  const switchLink = document.querySelector('[data-action="switch-auth"]');
  if (switchLink) switchLink.onclick = () => { state.authScreen = switchLink.dataset.target; state.authError=''; render(); };
  const form = document.getElementById('authForm');
  if (form) form.onsubmit = (ev) => {
    ev.preventDefault();
    const isSignup = state.authScreen === 'signup';
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    if (isSignup) {
      const name = document.getElementById('authName').value.trim();
      const company = document.getElementById('authCompany').value.trim();
      if (!name || !company || !email || !password) { state.authError = t('fillAllFields'); render(); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { state.authError = t('invalidEmail'); render(); return; }
      if (password.length < 6) { state.authError = t('shortPassword'); render(); return; }
      saveSession({ name, company, email });
    } else {
      if (!email || !password) { state.authError = t('fillAllFields'); render(); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { state.authError = t('invalidEmail'); render(); return; }
      const namePart = email.split('@')[0];
      const niceName = namePart.charAt(0).toUpperCase() + namePart.slice(1);
      saveSession({ name: niceName, company: 'Örnek Sanayi A.Ş.', email });
    }
    state.authError = '';
    render();
  };
}

// ============ EVENT HANDLERS ============
function attachHandlers() {
  document.getElementById('themeBtn').onclick = () => { state.theme = state.theme==='dark'?'light':'dark'; try { localStorage.setItem('wtb_theme', state.theme); } catch(e){}; render(); };
  document.querySelectorAll('[data-action="set-lang"]').forEach(el => {
    el.onclick = () => { state.lang = el.dataset.lang; try { localStorage.setItem('wtb_lang', state.lang); } catch(e){}; render(); };
  });
  const userChip = document.getElementById('userChipBtn');
  if (userChip) userChip.onclick = (ev) => {
    ev.stopPropagation();
    const dd = document.getElementById('userDropdown');
    dd.style.display = dd.style.display === 'none' ? 'block' : 'none';
  };
  document.addEventListener('click', () => {
    const dd = document.getElementById('userDropdown');
    if (dd) dd.style.display = 'none';
  }, { once: true });
  const logoutBtn = document.querySelector('[data-action="logout"]');
  if (logoutBtn) logoutBtn.onclick = (ev) => { ev.stopPropagation(); clearSession(); state.authScreen='login'; render(); };

  document.querySelectorAll('[data-nav]').forEach(el => {
    el.onclick = () => { state.activeScreen = el.dataset.nav; render(); };
  });
  document.querySelectorAll('[data-stab]').forEach(el => {
    el.onclick = () => {
      const group = el.dataset.stabgroup;
      document.querySelectorAll(`[data-stabgroup="${group}"]`).forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      document.querySelectorAll('.stab-panel').forEach(p => p.classList.remove('active'));
      document.getElementById(el.dataset.stab).classList.add('active');
    };
  });

  // Account code autocomplete (Carry/AJE/RJE account input)
  setupAccountAutocomplete();

  // Journal entry edits
  document.querySelectorAll('[data-je-field]').forEach(el => {
    el.onchange = () => {
      const sheet = state[el.dataset.jeSheet];
      const idx = parseInt(el.dataset.jeIdx);
      const field = el.dataset.jeField;
      const entry = sheet.entries[idx];
      if (field === 'accountCode' || field === 'comment') entry[field] = el.value.trim();
      else entry[field] = parseFloat(el.value.replace(/[.,]/g,'')) || 0;
      rebuildEngine();
      render();
    };
  });

  document.querySelectorAll('[data-action="del-je"]').forEach(el => {
    el.onclick = () => {
      const sheet = state[el.dataset.sheet];
      sheet.entries.splice(parseInt(el.dataset.idx), 1);
      rebuildEngine();
      render();
      toast(t('entryDeleted'));
    };
  });

  document.querySelectorAll('[data-action="add-je"]').forEach(el => {
    el.onclick = () => {
      const sheet = state[el.dataset.sheet];
      const maxAdj = Math.max(0, ...sheet.entries.map(e => e.adjNo || 0));
      sheet.addEntry({ adjNo: maxAdj + 1, groupLabel: 'Yeni manuel kayıt', accountCode: '', debit: 0, credit: 0, source: 'manual' });
      rebuildEngine();
      render();
    };
  });

  // Mapping edits
  document.querySelectorAll('[data-map-code]').forEach(el => {
    el.onchange = () => {
      const acc = state.accountMap.get(el.dataset.mapCode);
      if (acc) { acc.ifrsLine = el.value || null; rebuildEngine(); render(); }
    };
  });
  document.querySelectorAll('[data-note-code]').forEach(el => {
    el.onchange = () => {
      const acc = state.accountMap.get(el.dataset.noteCode);
      if (acc) acc.noteRef = el.value;
    };
  });

  // FA schedule add
  const faCostCodeEl = document.getElementById('faCostCode');
  const faDepCodeEl = document.getElementById('faDepCode');
  const updateFaCodePreview = (input, previewEl) => {
    if (!input || !previewEl) return;
    const acc = state.accountMap.get(input.value.trim());
    previewEl.textContent = acc ? `→ ${acc.accountName}` : '';
  };
  if (faCostCodeEl) {
    faCostCodeEl.addEventListener('input', () => updateFaCodePreview(faCostCodeEl, document.getElementById('faCostCodeName')));
    faCostCodeEl.addEventListener('change', () => updateFaCodePreview(faCostCodeEl, document.getElementById('faCostCodeName')));
  }
  if (faDepCodeEl) {
    faDepCodeEl.addEventListener('input', () => updateFaCodePreview(faDepCodeEl, document.getElementById('faDepCodeName')));
    faDepCodeEl.addEventListener('change', () => updateFaCodePreview(faDepCodeEl, document.getElementById('faDepCodeName')));
  }
  const addFaBtn = document.querySelector('[data-action="add-fa"]');
  if (addFaBtn) addFaBtn.onclick = () => {
    const name = document.getElementById('faName').value.trim();
    const costCode = document.getElementById('faCostCode').value.trim();
    const depCode = document.getElementById('faDepCode').value.trim();
    const life = parseFloat(document.getElementById('faLife').value) || 10;
    const cost = parseFloat(document.getElementById('faCost').value.replace(/[.,]/g,'')) || 0;
    if (!name || !costCode || !depCode || !cost) { toast(t('allFields')); return; }
    state.faAssets.push({ name, accountCodeCost: parseInt(costCode), accountCodeAccDep: parseInt(depCode), cost, activationDate: state.periodEnd, usefulLifeYears: life, statutoryAnnualDep: cost/life });
    applyFaScheduleToAje();
    rebuildEngine();
    render();
    toast(t('assetAdded'));
  };
  document.querySelectorAll('[data-action="del-fa"]').forEach(el => {
    el.onclick = () => {
      const idx = parseInt(el.dataset.idx);
      state.faAssets.splice(idx, 1);
      applyFaScheduleToAje();
      rebuildEngine();
      render();
      toast(t('entryDeleted'));
    };
  });

  // ETB save
  const saveEtbBtn = document.querySelector('[data-action="save-etb"]');
  if (saveEtbBtn) saveEtbBtn.onclick = () => {
    state.etb.discountRate = parseFloat(document.getElementById('etbDiscount').value) || state.etb.discountRate;
    state.etb.salaryIncrease = parseFloat(document.getElementById('etbSalary').value) || state.etb.salaryIncrease;
    state.etb.turnoverRate = parseFloat(document.getElementById('etbTurnover').value) || state.etb.turnoverRate;
    state.etb.employeeCount = parseInt(document.getElementById('etbEmployees').value) || state.etb.employeeCount;
    state.etb.dbo = parseFloat(document.getElementById('etbDbo').value.replace(/[.,]/g,'')) || state.etb.dbo;
    state.etb.currentServiceCost = parseFloat(document.getElementById('etbServiceCost').value.replace(/[.,]/g,'')) || state.etb.currentServiceCost;
    state.etb.interestCost = parseFloat(document.getElementById('etbInterest').value.replace(/[.,]/g,'')) || state.etb.interestCost;
    state.etb.oci = parseFloat(document.getElementById('etbOci').value.replace(/[.,]/g,'')) || state.etb.oci;
    applyEtbToAje();
    rebuildEngine();
    render();
    toast(t('etbSaved'));
  };

  // Tax rate update
  const taxBtn = document.querySelector('[data-action="update-tax-rate"]');
  if (taxBtn) taxBtn.onclick = () => {
    const v = parseFloat(document.getElementById('taxRateInput').value);
    if (!isNaN(v)) { state.taxRate = v / 100; rebuildEngine(); render(); toast(t('taxRateUpdated')); }
  };

  document.querySelectorAll('[data-action="export-info"]').forEach(el => {
    el.onclick = () => toast(t('exportInfo'));
  });
  const pasteBtn = document.querySelector('[data-action="paste-mizan"]');
  if (pasteBtn) pasteBtn.onclick = () => toast(t('pasteInfo'));
  const addAccBtn = document.querySelector('[data-action="add-account"]');
  if (addAccBtn) addAccBtn.onclick = () => toast(t('addAccountInfo'));
}
